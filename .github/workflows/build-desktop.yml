name: Build Desktop (Windows + macOS, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            job_name: windows-amd64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            job_name: macos-arm64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            job_name: macos-amd64
    runs-on: ${{ matrix.platform }}
    env:
      # Без APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / APPLE_ID сборка macOS
      # получается БЕЗ подписи и БЕЗ нотаризации (Gatekeeper будет ругаться —
      # это ожидаемо, README описывает `xattr -cr`).
      # Без WINDOWS_SIGNING_CERTIFICATE / TAURI_SIGNING_PRIVATE_KEY сборка
      # Windows получается БЕЗ подписи.
      MACOSX_DEPLOYMENT_TARGET: 10.13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (macos only)
        if: matrix.platform == 'macos-latest'
        run: brew install autoconf automake libtool protobuf cmake

      - name: Install dependencies (windows only)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc cmake nasm -y --no-progress

      - name: Set cross-compilation environment for macOS x86_64
        if: matrix.job_name == 'macos-amd64'
        run: |
          echo "CFLAGS=-arch x86_64" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-arch x86_64" >> "$GITHUB_ENV"
          echo "LDFLAGS=-arch x86_64" >> "$GITHUB_ENV"
          echo "CC_x86_64_apple_darwin=clang -arch x86_64" >> "$GITHUB_ENV"
          echo "CXX_x86_64_apple_darwin=clang++ -arch x86_64" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=clang" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: build-desktop-${{ matrix.job_name }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ""
          releaseName: ""

      - name: Create portable exe (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "desktop/src-tauri/target/release/soundcloud-desktop.exe" -ErrorAction Stop
          $dest = "desktop/src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item $exe.FullName "$dest/soundcloud-desktop-portable.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-builds-${{ matrix.job_name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/portable/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.tar.gz
          retention-days: 7